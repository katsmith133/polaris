# Mesh-specific overrides to the shared aquaplanet configuration.
[aquaplanet]

# Icosahedral spherical mesh; cell width in km, selected at setup time.
mesh_type = icos
resolution = 30.

# Initial 30-day experiment with instantaneous history every five days.
run_duration = 30.
output_interval = 432000.
start_type = StartUp

# No separate daily or high-frequency diagnostic output.
diagnostics_enabled = False
