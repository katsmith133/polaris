# An idealized wind-driven transient, not an equilibrated climate experiment.
[aquaplanet]

# Mesh type and resolution are supplied by qu240.cfg or icos30.cfg.

# Zonal stress = wind_stress_amplitude *
#               (sin(2 * latitude) + 0.5 * sin(6 * latitude)), N m^-2.
# Geographic latitude is in radians; eastward stress is positive.
wind_stress_amplitude = 0.1

# Conservative temperature in degrees C and Absolute Salinity in g kg^-1.
# T(z) = deep_temperature + temperature_contrast * exp(z / temperature_scale).
deep_temperature = 4.
temperature_contrast = 16.
temperature_scale = 1000.
salinity = 35.

# Duration in days (one year with the no-leap calendar) and output in seconds.
run_duration = 365.
output_interval = 86400.

# Restart cadence in seconds (five model days), independent of history.
# Each checkpoint replaces restart.nc and updates ocn.pointer.
restart_interval = 432000.

# Omega start mode. Use Continue only when this forward work directory has a
# valid ocn.pointer and the restart file it names.
start_type = StartUp

# Omega-only hourly diagnostic snapshots during the first two model days.
# These are instantaneous fields, not accumulated discrete energy budgets.
diagnostics_enabled = True
diagnostics_interval = 3600.
# Absolute model times; update these if changing the simulation start date.
diagnostics_start_time = 0001-01-01_01:00:00
diagnostics_end_time = 0001-01-03_00:00:00

# 'auto' scales 600 s at 240 km linearly with resolution; this is a starting
# estimate, not a stability guarantee. A numerical override is in seconds.
time_step = auto
dt_per_km = 2.5
barotropic_substeps = 30

# Explicit dissipation settings; reassess at other resolutions.
# Laplacian viscosity per resolution (m2 s-1 per km), scaling with dx.
# Equivalent to realistic_global's 1000 m2 s-1 at 30 km.
horizontal_viscosity_per_km = 33.3333333333
# Equivalent to realistic_global's 1.2e11 m4 s-1 at 30 km.
horizontal_viscosity_del4_enabled = True
horizontal_viscosity_del4_per_km3 = 4444444.44444444
# Horizontal tracer diffusion is disabled in realistic_global; the coefficient
# is retained for optional use if the enable switch is turned on.
horizontal_diffusivity_enabled = False
horizontal_diffusivity_per_km = 0.0416666666667
background_viscosity = 1.e-4
background_diffusivity = 1.e-5
bottom_drag_coefficient = 1.e-3

[vertical_grid]
grid_type = tanh_dz
coord_type = z-star
vert_levels = 32
bottom_depth = 4000.
min_layer_thickness = 10.
max_layer_thickness = 250.
partial_cell_type = None
min_pc_fraction = 0.1

[coriolis]
type = spherical

# Mosaic-backed global maps. Shared limits make initial/final SST comparable.
[aquaplanet_temperature_viz]
colormap_name = viridis
norm_type = linear
norm_args = {'vmin': 4., 'vmax': 20.}

[aquaplanet_anomaly_viz]
colormap_name = RdBu_r
norm_type = linear
norm_args = {}

[aquaplanet_kpp_viz]
colormap_name = viridis
norm_type = linear
norm_args = {'vmin': 0.}

[aquaplanet_vorticity_viz]
colormap_name = RdBu_r
norm_type = linear
# Symmetric bounds are computed from the final surface field.
norm_args = {}
