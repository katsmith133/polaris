# Options related to the vertical grid
[vertical_grid]

grid_type = uniform
vert_levels = 100
bottom_depth = 400.0
coord_type = z-star
partial_cell_type = None
min_pc_fraction = 0.1

[coriolis]

type = constant
constant_f = 0.0

[ocean]

# Equation of state type used when converting geometric thickness
# to pseudo-thickness for Omega vertical-coordinate files.
eos_type = teos-10

[vert_mix]

resolution = 10.0
surface_temperature = 20.0
surface_salinity = 34.0
zonal_velocity = 0.0
meridional_velocity = 0.0
run_duration = 1.0
time_integrator = RK4
dt_seconds = 300.0
btr_dt_seconds = 30.0
output_interval_seconds = 3600.0

[vert_mix_temperature]

# Stable profiles have warmer water at the surface and colder below,
# so gradients should be non-negative because z is negative downward.
start = 0.01
stop = 0.04
increment = 0.01

[vert_mix_salinity]

# Stable profiles have fresher water at the surface and saltier below,
# so gradients should be non-positive because z is negative downward.
start = -0.04
stop = -0.01
increment = 0.01
